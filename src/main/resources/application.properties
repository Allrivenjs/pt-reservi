spring.application.name=reservi
spring.profiles.active=dev
spring.datasource.url=jdbc:mysql://localhost:3306/reservationdb
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=info
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.security.user.name=user
spring.security.user.password=password
spring.security.user.roles=USER

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Dialecto de Hibernate para MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect